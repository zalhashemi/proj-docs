[project]
name = "ledgerline"
version = "0.9.2"
description = "Ledgerline: order and invoice API for B2B wholesalers."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "sentry-sdk>=2.14",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6", "pytest-cov>=5.0"]

[project.scripts]
ledgerline = "app.cli:main"

[tool.ruff]
line-length = 100

[tool.coverage.run]
source = ["app"]
